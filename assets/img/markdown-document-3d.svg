<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Dokumen Markdown 3D</title>
  <desc id="description">Tumpukan dokumen grafit dengan tepi lime, sudut terlipat, heading Markdown, checklist, dan blok kode.</desc>
  <defs>
    <linearGradient id="background" x1="220" y1="950" x2="1390" y2="70" gradientUnits="userSpaceOnUse">
